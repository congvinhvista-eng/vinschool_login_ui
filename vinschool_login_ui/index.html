<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vinschool LMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" aria-label="Vinschool login">
        <img class="school-logo" src="alyabg.png" alt="Vinschool" />
          <div class="login-title">Welcome to Alya LMS</div>
        <div class="login-actions">
          <button class="login-button student" type="button">
            Student Login
          </button>
          <button class="login-button teacher" type="button">
            Teacher Login
          </button>
        </div>

        <a class="forgot-link" href="#">Forgot your password?</a>

        <div class="test-actions">
          <button type="button" class="outline-button">Entrance test</button>
          <button type="button" class="outline-button">Sample Test</button>
        </div>

        <label class="language-select">
          <svg class="flag" aria-hidden="true" viewBox="0 0 60 30">
            <rect width="60" height="30" fill="#012169" />
            <path d="m0 0 60 30M60 0 0 30" stroke="#fff" stroke-width="6" />
            <path d="m0 0 60 30M60 0 0 30" stroke="#c8102e" stroke-width="2.4" />
            <path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10" />
            <path d="M30 0v30M0 15h60" stroke="#c8102e" stroke-width="5" />
          </svg>
          <select aria-label="Language">
            <option>English</option>
            <option>Tiếng Việt</option>
          </select>
        </label>
      </section>

      <div class="chat-badge" aria-hidden="true">
        <img src="vinschool-logo.svg" alt="" />
      </div>
    </main>
  </body>
</html>
